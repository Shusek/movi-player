name: CI

on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kotlin-wasm:
    name: Kotlin/Wasm API, browser tests and publications
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Test the typed Kotlin/Wasm player in Chrome
        run: ./gradlew :player:wasmJsBrowserTest --no-daemon

      - name: Verify publishable KLIB and runtime ZIP
        run: >-
          ./gradlew
          :player:publishAllPublicationsToProjectLocalRepository
          :runtime-assets:publishAllPublicationsToProjectLocalRepository
          --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: movi-player-kotlin-wasm
          path: |
            build/project-local-repository/
            runtime-assets/build/distributions/*.zip
          if-no-files-found: error
          retention-days: 14
